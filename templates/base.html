<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crop Recommendation System — Intelligent Agricultural Analytics Dashboard">
    <title>{% block title %}Crop Recommendation System{% endblock %} | Crop Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="wrapper">

    <!-- ========== SIDEBAR ========== -->
    <nav id="sidebar-wrapper" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-brand">
            <span class="brand-icon">🌿</span>
            <h5>Crop Recommendation</h5>

        </div>

        <div class="sidebar-section-label">Navigation</div>
        <div class="sidebar-nav">
            <a href="{% url 'landing' %}" class="{% if active_page == 'landing' %}active{% endif %}">
                <span class="nav-icon">🏡</span> Home
            </a>
            <a href="{% url 'overview' %}" class="{% if active_page == 'overview' %}active{% endif %}">
                <span class="nav-icon">📊</span> Overview
            </a>
            <a href="{% url 'crop_analysis' %}" class="{% if active_page == 'crop_analysis' %}active{% endif %}">
                <span class="nav-icon">🌾</span> Crop Analysis
            </a>
            <a href="{% url 'environmental_analysis' %}" class="{% if active_page == 'environmental_analysis' %}active{% endif %}">
                <span class="nav-icon">🌡️</span> Environmental Analysis
            </a>
            <a href="{% url 'model_performance' %}" class="{% if active_page == 'model_performance' %}active{% endif %}">
                <span class="nav-icon">🤖</span> Model Performance
            </a>
            <a href="{% url 'crop_recommendation' %}" class="{% if active_page == 'crop_recommendation' %}active{% endif %}">
                <span class="nav-icon">🔮</span> Crop Recommendation
            </a>
            <a href="{% url 'dataset_explorer' %}" class="{% if active_page == 'dataset_explorer' %}active{% endif %}">
                <span class="nav-icon">📂</span> Dataset Explorer
            </a>
        </div>

        <div class="sidebar-footer">
            Dataset: 2,200 records · 22 crop classes
        </div>
    </nav>
    <!-- ========== END SIDEBAR ========== -->

    <!-- ========== MAIN CONTENT ========== -->
    <div id="page-content-wrapper">
        <header class="top-navbar">
            <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>

        </header>

        <main class="page-body">
            {% block content %}{% endblock %}
        </main>
    </div>
    <!-- ========== END MAIN CONTENT ========== -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
